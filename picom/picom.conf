
#################################
#  BACKEND & RENDERING
#################################

backend = "glx";
glx-copy-from-front = false;
use-damage = true;

#################################
#  SHADOWS (Depth Effect)
#################################

#shadow = true;
#shadow-radius = 30;
#shadow-opacity = 0.7;
#shadow-offset-x = 0;
#shadow-offset-y = 15;
#shadow-color = "#000000";
#
#shadow-exclude = [
#  "window_type = 'dock'",
#  "window_type = 'desktop'",
#  "class_g = 'Polybar'",
#  "class_g = 'Dunst'"
#];

#################################
#  BLUR (Frosted Glass Effect)
#################################

blur-method = "gaussian";
blur-size = 20;
blur-deviation = 8.0;
blur-strength = 10;

blur-background = true;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#  ROUNDED CORNERS
#################################

corner-radius = 16;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

#################################
#  FADING (iOS-Style Fade In)
#################################

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 8;

fade-exclude = [];

#################################
#  OPACITY (Smooth Transitions)
#################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "100:class_g = 'Firefox'",
  "100:class_g = 'Brave'",
  "100:class_g = 'Chromium'",
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'",
  "100:name = 'Rofi'"
];

#################################
#  WINDOW DETECTION
#################################

detect-rounded-corners = true;
detect-client-leader = true;
detect-transient = true;

#################################
#  PERFORMANCE
#################################

vsync = true;
use-ewmh-active-win = true;

#################################
#  WINDOW TYPES
#################################

wintypes = {
  tooltip = { 
    fade = true; 
    shadow = false; 
    opacity = 0.9; 
    focus = true; 
  };
  dock = { 
    shadow = false; 
    clip-shadow-above = true; 
  };
  popup_menu = { 
    opacity = 0.95;
    shadow = true;
  };
  dropdown_menu = { 
    opacity = 0.95;
    shadow = true;
  };
  menu = { 
    opacity = 0.95;
    shadow = true;
  };
};
